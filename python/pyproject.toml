[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegamma"
version = "0.1.0"
description = "The trace-gamma distribution: a three-cumulant calibrated reference for quadratic-form tests"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "William J. Dwyer"}]
keywords = ["quadratic form", "generalized chi-square", "Satterthwaite",
            "Welch", "Behrens-Fisher", "heteroscedasticity", "reference distribution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Deposit = "https://doi.org/10.5281/zenodo.22060095"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracegamma = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
