[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegamma"
version = "0.1.1"
description = "The trace-gamma distribution: a three-cumulant calibrated reference for quadratic-form tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William J. Dwyer"}]
keywords = ["quadratic form", "generalized chi-square", "Satterthwaite",
            "Welch", "Behrens-Fisher", "heteroscedasticity", "reference distribution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  # One classifier per version the CI matrix actually runs. If a version is
  # added or removed here it must be added or removed in python.yml too: an
  # untested classifier is a claim, not a fact.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wjdwyer/tracegamma"
Repository = "https://github.com/wjdwyer/tracegamma"
Issues = "https://github.com/wjdwyer/tracegamma/issues"
Changelog = "https://github.com/wjdwyer/tracegamma/blob/main/python/CHANGELOG.md"
Deposit = "https://doi.org/10.5281/zenodo.24354607"
Paper = "https://doi.org/10.5281/zenodo.22060095"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracegamma = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
