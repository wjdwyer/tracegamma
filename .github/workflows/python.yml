name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 was dropped on 2026-11-18. ubuntu-latest became Ubuntu 26.04 on
        # 19 Oct 2026 and actions/python-versions ships no 3.9 build for it, so
        # that cell could not be provisioned at all -- setup-python failed
        # before a line of this package ran. 3.9 has been end-of-life since
        # October 2025, and on cp39 pip resolves numpy 2.0.2 / scipy 1.13.1,
        # so the cell was testing a dependency stack no user installs today.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test, including doctests
        run: pytest -q --doctest-modules src/tracegamma tests

  build:
    name: build and check distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: The versions claimed to PyPI must be the versions tested
        run: python ../check_version_claims.py ..
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: python/dist/*
