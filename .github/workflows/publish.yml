name: publish to PyPI

# Runs only when you publish a GitHub Release, so a push can never ship a
# release by accident. Uses PyPI trusted publishing (OIDC): no API token is
# stored in this repository. Configure the publisher first, on the PyPI
# project page under Manage -> Publishing, with:
#   owner: <you>   repository: tracegamma   workflow: publish.yml   environment: pypi
# See https://docs.pypi.org/trusted-publishers/using-a-publisher/

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Refuse to publish if the tests do not pass
        run: |
          python -m pip install -e ".[test]"
          pytest -q --doctest-modules src/tracegamma tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/*

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tracegamma
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      # download-artifact stays on v4: it was not named in the Node 20
      # deprecation annotation and its current major was not verified.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
